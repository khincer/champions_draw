name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The UI route serves static/ui/index.html, which is gitignored build
      # output. Without it the route answers 503 and the test suite fails. The
      # frontend job builds it once and hands it over, so this job does not
      # repeat the Node install and build.
      - name: Download built UI
        uses: actions/download-artifact@v4
        with:
          name: built-ui
          path: static/ui

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Run Django test suite
        run: python manage.py test

  frontend:
    name: Frontend (Preact)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run node --test suites
        run: >-
          node --test
          frontend/src/test/tieUtils.test.mjs
          frontend/src/test/careerEngine.test.mjs
          frontend/src/test/reconcile.test.mjs

      - name: Upload built UI
        uses: actions/upload-artifact@v4
        with:
          name: built-ui
          path: static/ui
          if-no-files-found: error
