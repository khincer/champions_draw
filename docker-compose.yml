services:
  web:
    build:
      context: .
      target: build
    ports:
      - "8001:8001"
      - "5173:5173"
    env_file: .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DJANGO_SETTINGS_MODULE: champions_draw.settings
      DJANGO_DEBUG: "1"
    volumes:
      # Bind the source so edits reload. Without this the code is whatever the
      # image was built with, and every change needs a rebuild.
      - .:/app
      # Keep the image's node_modules: the bind mount above would otherwise
      # expose the host's Windows builds, which break vite/esbuild.
      - /app/node_modules
      - db_data:/app/data
      - fixtures_data:/app/draw/data
    # package.json pins `vite --host 127.0.0.1` -- correct for host-only dev but
    # unreachable through a published container port. The extra flag below is
    # the last --host, so it wins and Vite binds all interfaces in the container.
    command: >
      sh -c "python manage.py migrate &&
      python manage.py import_seed_input draw/data/ucl_league_phase_seed_input_2025_26.json --set-active --seed &&
      python manage.py import_seed_input draw/data/ucl_league_phase_seed_input_2026_27.json --seed &&
      npm run build &&
      python manage.py runserver 0.0.0.0:8001 &
      npm run dev -- --host 0.0.0.0"

  cron:
    build:
      context: .
      target: build
    env_file: .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DJANGO_SETTINGS_MODULE: champions_draw.settings
    volumes:
      # Same bind mount as web: the cron runs management commands, so it must
      # see the current code rather than the code baked into the image.
      - .:/app
      - db_data:/app/data
      - fixtures_data:/app/draw/data
    command: >
      sh -c "echo '[cron] waiting for initial migrate...';
      sleep 15;
      echo '[cron] initial leagues sync...';
      python manage.py sync_leagues 2>&1;
      echo '[cron] initial league fixtures sync...';
      python manage.py sync_league_fixtures 2>&1;
      counter=0;
      while true; do
        echo '[cron] syncing real fixture results...';
        python manage.py sync_real_fixture_results --source promiedos 2>&1;
        counter=$((counter + 1));
        if [ $((counter % 288)) -eq 0 ]; then
          echo '[cron] syncing leagues...';
          python manage.py sync_leagues 2>&1;
          echo '[cron] syncing league fixtures...';
          python manage.py sync_league_fixtures 2>&1;
        fi;
        echo '[cron] sleeping 5m...';
        sleep 300;
      done"

volumes:
  db_data:
  fixtures_data:

