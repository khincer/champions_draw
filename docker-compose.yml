services:
  web:
    build:
      context: .
      target: build
    ports:
      - "8001:8001"
      - "5173:5173"
    env_file: .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DJANGO_SETTINGS_MODULE: champions_draw.settings
      DJANGO_DEBUG: "1"
    volumes:
      - db_data:/app/data
    command: >
      sh -c "python manage.py migrate &&
      python manage.py import_seed_input draw/data/ucl_league_phase_seed_input_2025_26.json --set-active --seed &&
      python manage.py import_seed_input draw/data/ucl_league_phase_seed_input_2026_27.json --seed &&
      npm run build &&
      python manage.py runserver 0.0.0.0:8001 &
      npm run dev"

  cron:
    build:
      context: .
      target: build
    env_file: .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DJANGO_SETTINGS_MODULE: champions_draw.settings
    volumes:
      - db_data:/app/data
    command: >
      sh -c "echo '[cron] waiting for initial migrate...';
      sleep 15;
      while true; do
        echo '[cron] syncing leagues...';
        python manage.py sync_leagues 2>&1;
        echo '[cron] sleeping 24h...';
        sleep 86400;
      done"

volumes:
  db_data:

