<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Champions Draw</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var theme = 'light';
        try {
          if (window.localStorage.getItem('champions_draw_theme') === 'dark') {
            theme = 'dark';
          }
        } catch (error) {
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;

        /* Locale resolution mirrors frontend/src/i18n/detect.js, which this
           inline script cannot import. The bootstrap-sync test keeps these
           literals, this fallback and the resolved outcome equal to
           SUPPORTED_LOCALES / resolveLocale. Set before paint so `lang` is
           never briefly wrong. */
        var supported = ['en', 'es', 'pt', 'fr'];
        var stored = null;
        try {
          stored = window.localStorage.getItem('champions_draw_locale');
        } catch (error) {
        }
        var locale = 'en';
        var tags = [stored].concat(navigator.languages || []);
        for (var i = 0; i < tags.length; i += 1) {
          if (typeof tags[i] !== 'string') continue;
          var base = tags[i].trim().toLowerCase().split(/[-_]/)[0];
          if (supported.indexOf(base) !== -1) {
            locale = base;
            break;
          }
        }
        document.documentElement.lang = locale;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
